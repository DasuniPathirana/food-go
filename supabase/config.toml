# Isolated local and CI stack only. Hosted settings use environments/development.
project_id = "food-go-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17
health_timeout = "2m"

[db.migrations]
enabled = true

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = [
  "http://127.0.0.1:3000/auth/callback?next=/profile",
  "http://127.0.0.1:3000/auth/callback?next=/auth/reset-password"
]
enable_signup = true
minimum_password_length = 12
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enabled = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "5MiB"

[studio]
enabled = false

[realtime]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
